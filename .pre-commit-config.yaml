# Hooks for the template repo itself. Generated projects ship their own config.
# Files under {{cookiecutter.project_slug}}/ contain Jinja, so syntax checks skip them;
# `make test-template` renders them and runs the generated project's full checks instead.
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
        exclude: ^\{\{cookiecutter\.project_slug\}\}/
      - id: check-toml
        exclude: ^\{\{cookiecutter\.project_slug\}\}/
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: no-env-file
        name: forbid committing .env
        entry: .env must not be committed (use .env.example)
        language: fail
        files: (^|/)\.env$

      - id: test-template
        name: render template and run generated projects' checks
        entry: ./scripts/test_template.sh
        language: system
        files: ^(\{\{cookiecutter\.project_slug\}\}/|hooks/|cookiecutter\.json$|scripts/test_template\.sh$)
        pass_filenames: false
